name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govinsight
          POSTGRES_USER: govinsight_app
          POSTGRES_PASSWORD: govinsight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govinsight_app -d govinsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOVINSIGHT_DATABASE_URL: postgresql+psycopg://govinsight_app:govinsight_ci@127.0.0.1:5432/govinsight
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Tests
        run: python -m pytest -m "not live_api" --cov=govinsight
      - name: Agent safety benchmark
        run: python -m govinsight.agents.evaluation tests/fixtures/agents/agent_evaluation.json
      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag govinsight-ai:ci .
